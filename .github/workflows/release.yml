name: Release

# Push a tag like v1.0.0 to build ControllerCam-v1.0.0.zip and attach it to a GitHub release.
# WoWUp's GitHub source installs from that zip (top-level folder: ControllerCam/).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the TOC version
        run: |
          toc_version=$(grep -m1 '^## Version:' ControllerCam.toc | sed 's/^## Version: *//' | tr -d '\r')
          if [ "v${toc_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match TOC version v${toc_version}" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the tests
        run: |
          pip install lupa
          python tests/test_controllercam.py

      - name: Build zip
        run: |
          mkdir -p dist/ControllerCam
          cp ControllerCam.toc Locales.lua Schema.lua Presets.lua Share.lua Core.lua Slash.lua Options.lua LICENSE README.md CHANGELOG.md dist/ControllerCam/
          cp -r Media dist/ControllerCam/Media
          (cd dist && zip -r "ControllerCam-${GITHUB_REF_NAME}.zip" ControllerCam)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "dist/ControllerCam-${GITHUB_REF_NAME}.zip" \
            --title "ControllerCam ${GITHUB_REF_NAME}" \
            --generate-notes
